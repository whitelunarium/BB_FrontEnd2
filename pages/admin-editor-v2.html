---
layout: pnec-base
title: "Live Editor v2"
use_poway_live_styles: false
---

<style>
:root {
  --v2-bg:        #0a1628;
  --v2-surface:   #0f1e36;
  --v2-surface2:  #152540;
  --v2-border:    rgba(255,255,255,0.10);
  --v2-text:      #e8f0fb;
  --v2-muted:     #8ba3c7;
  --v2-accent:    #3b82f6;
  --v2-green:     #10b981;
  --v2-amber:     #f59e0b;
  --v2-red:       #ef4444;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--v2-bg); color: var(--v2-text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

#v2-gate { display: none; min-height: 100vh; place-items: center; padding: 24px; }
#v2-gate.visible { display: grid; }
#v2-gate-card { width: min(420px,100%); background: var(--v2-surface); border: 1px solid var(--v2-border); border-radius: 16px; padding: 32px; }

#v2-shell { display: none; height: 100vh; flex-direction: column; }
#v2-shell.visible { display: flex; }

/* Top bar */
.v2-topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--v2-surface); border-bottom: 1px solid var(--v2-border); flex-shrink: 0; }
.v2-topbar .v2-title { font-weight: 700; font-size: .95rem; }
.v2-topbar select { background: var(--v2-bg); color: var(--v2-text); border: 1px solid var(--v2-border); padding: 6px 8px; border-radius: 6px; }
.v2-spacer { flex: 1; }
.v2-btn { background: var(--v2-accent); color: white; border: none; padding: 7px 14px; border-radius: 6px; font-size: .85rem; cursor: pointer; }
.v2-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.v2-btn-ghost { background: transparent; color: var(--v2-muted); border: 1px solid var(--v2-border); }
.v2-btn-ghost:hover { color: var(--v2-text); border-color: var(--v2-text); }
.v2-btn-ghost.is-on { color: var(--v2-accent); border-color: var(--v2-accent); }

/* Banner */
.v2-banner { display: none; background: var(--v2-amber); color: #1f2937; padding: 8px 14px; font-size: .85rem; flex-shrink: 0; }

/* Body */
.v2-body { display: grid; grid-template-columns: 360px 1fr; flex: 1; min-height: 0; }
.v2-sidebar { background: var(--v2-surface); border-right: 1px solid var(--v2-border); display: flex; flex-direction: column; min-height: 0; }

/* Tree */
.v2-tree-container { padding: 12px; overflow-y: auto; max-height: 50%; border-bottom: 1px solid var(--v2-border); }
.v2-tree-header { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--v2-muted); padding-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
.v2-tree-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--v2-bg); border: 1px solid var(--v2-border); border-radius: 6px; margin-bottom: 6px; cursor: pointer; transition: border-color 120ms; }
.v2-tree-row:hover { border-color: var(--v2-accent); }
.v2-tree-row.is-selected { border-color: var(--v2-accent); background: rgba(59,130,246,0.1); }
.v2-tree-row.is-dragging { opacity: 0.4; }
.v2-tree-row.is-drag-over { border-top: 2px solid var(--v2-accent); }
.v2-tree-handle { color: var(--v2-muted); font-size: 0.9rem; cursor: grab; user-select: none; }
.v2-tree-label { flex: 1; font-size: .9rem; }
.v2-tree-actions { display: flex; gap: 4px; opacity: 0.5; transition: opacity 120ms; }
.v2-tree-row:hover .v2-tree-actions { opacity: 1; }
.v2-icon-btn { background: transparent; color: var(--v2-text); border: none; cursor: pointer; padding: 2px 4px; font-size: .9rem; border-radius: 4px; }
.v2-icon-btn:hover { background: var(--v2-surface2); }
.v2-empty { color: var(--v2-muted); font-size: .85rem; padding: 16px; text-align: center; border: 1px dashed var(--v2-border); border-radius: 6px; }
#v2-add-section { width: 100%; margin-top: 8px; }

/* Settings panel */
.v2-settings-container { padding: 14px; flex: 1; overflow-y: auto; }
.v2-settings-empty { color: var(--v2-muted); font-size: .85rem; text-align: center; padding: 24px 0; }
.v2-settings-head { margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--v2-border); }
.v2-settings-head h3 { margin: 0; font-size: 1rem; }
.v2-settings-head p { margin: 4px 0 0; font-size: .8rem; color: var(--v2-muted); }
.v2-field { margin-bottom: 14px; }
.v2-field-label { display: block; font-size: .75rem; color: var(--v2-muted); margin-bottom: 6px; }
.v2-input { width: 100%; background: var(--v2-surface2); color: var(--v2-text); border: 1px solid var(--v2-border); padding: 8px 10px; border-radius: 4px; font: inherit; }
.v2-input:focus { outline: none; border-color: var(--v2-accent); }
.v2-textarea { resize: vertical; min-height: 90px; font-family: inherit; }
.v2-color { padding: 0; height: 32px; }
.v2-image-preview { font-size: .75rem; color: var(--v2-muted); padding: 6px 0; word-break: break-all; }
.v2-image-thumb { max-width: 100%; max-height: 100px; border-radius: 4px; display: block; }

/* Block list (e.g. FAQ items) */
.v2-blocks { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--v2-border); }
.v2-blocks-header { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--v2-muted); margin-bottom: 8px; }
.v2-block { background: var(--v2-bg); border: 1px solid var(--v2-border); border-radius: 6px; margin-bottom: 6px; }
.v2-block summary { padding: 8px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: .85rem; }
.v2-block summary::-webkit-details-marker { display: none; }
.v2-block summary::marker { content: ''; }
.v2-block-summary-label { flex: 1; }
.v2-block-actions { display: flex; gap: 2px; opacity: 0.6; }
.v2-block:hover .v2-block-actions { opacity: 1; }
.v2-block-body { padding: 0 10px 10px; }

/* Iframe */
.v2-preview { display: flex; flex-direction: column; min-height: 0; }
.v2-preview-toolbar { padding: 8px 14px; background: #334155; color: var(--v2-text); display: flex; align-items: center; gap: 10px; font-size: .8rem; border-bottom: 1px solid var(--v2-border); flex-shrink: 0; }
#v2-iframe { flex: 1; width: 100%; border: 0; background: white; }
#v2-iframe-url { flex: 1; color: var(--v2-muted); font-family: ui-monospace, monospace; font-size: .75rem; word-break: break-all; }
.v2-live-badge { background: var(--v2-green); color: white; padding: 2px 8px; border-radius: 10px; font-size: .7rem; }

/* Toast */
#v2-toast { position: fixed; bottom: 20px; right: 20px; background: var(--v2-surface); border: 1px solid var(--v2-border); padding: 10px 14px; border-radius: 6px; opacity: 0; transition: opacity 200ms; z-index: 100; max-width: 360px; }
#v2-toast.error { border-color: var(--v2-red); color: #fecaca; }
#v2-toast.ok    { border-color: var(--v2-green); color: #bbf7d0; }

/* Picker modal */
#v2-picker { position: fixed; inset: 0; background: rgba(10,22,40,0.85); display: none; place-items: center; padding: 24px; z-index: 200; }
#v2-picker.is-open { display: grid; }
.v2-picker-shell { background: var(--v2-surface); border: 1px solid var(--v2-border); border-radius: 12px; padding: 20px; max-width: 720px; width: 100%; max-height: 80vh; overflow-y: auto; }
.v2-picker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.v2-picker-header h3 { margin: 0; font-size: 1.1rem; }
.v2-picker-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.v2-picker-card { background: var(--v2-bg); border: 1px solid var(--v2-border); border-radius: 8px; padding: 14px; cursor: pointer; transition: border-color 120ms; }
.v2-picker-card:hover { border-color: var(--v2-accent); }
.v2-picker-card h4 { margin: 0 0 6px; font-size: .95rem; }
.v2-picker-card p  { margin: 0; font-size: .8rem; color: var(--v2-muted); line-height: 1.4; }
</style>

<!-- Auth gate -->
<div id="v2-gate">
  <div id="v2-gate-card">
    <h2 style="margin:0 0 8px;">🔒 Admin Only</h2>
    <p style="color:var(--v2-muted);margin:0 0 16px;">You need to be signed in with an admin account to access the live editor.</p>
    <a href="{{ '/pages/register.html#login' | relative_url }}" class="v2-btn" style="text-decoration:none;display:inline-block;">Go to Login</a>
  </div>
</div>

<!-- Editor shell -->
<div id="v2-shell">
  <!-- Top bar -->
  <div class="v2-topbar">
    <span class="v2-title">PNEC Live Editor v2</span>
    <select id="v2-page-select" aria-label="Page">
      <option value="home">Homepage</option>
      <option value="about">About</option>
      <option value="programs">Programs</option>
    </select>
    <button id="v2-inspector-toggle" class="v2-btn v2-btn-ghost" title="Click any element in the preview to select it">🔍 Inspector</button>
    <div class="v2-spacer"></div>
    <button id="v2-share"        class="v2-btn v2-btn-ghost" title="Share preview link with non-admins">🔗 Share</button>
    <button id="v2-view-preview" class="v2-btn v2-btn-ghost" title="Open the public page in a new tab">↗ View live</button>
    <button id="v2-publish"      class="v2-btn">Publish</button>
  </div>

  <div id="v2-banner" class="v2-banner"></div>

  <div class="v2-body">
    <aside class="v2-sidebar">
      <div class="v2-tree-container">
        <div class="v2-tree-header">
          <span>Sections</span>
        </div>
        <div id="v2-tree"></div>
        <button id="v2-add-section" class="v2-btn">+ Add section</button>
      </div>
      <div class="v2-settings-container" id="v2-settings"></div>
    </aside>
    <section class="v2-preview">
      <div class="v2-preview-toolbar">
        <span style="cursor:pointer;" onclick="document.getElementById('v2-iframe').contentWindow.location.reload()">↻</span>
        <span id="v2-iframe-url"></span>
        <span class="v2-live-badge">DRAFT</span>
      </div>
      <iframe id="v2-iframe" title="Page preview"></iframe>
    </section>
  </div>
</div>

<!-- Section picker -->
<div id="v2-picker">
  <div class="v2-picker-shell">
    <div class="v2-picker-header">
      <h3>Add a section</h3>
      <button id="v2-picker-close" class="v2-btn v2-btn-ghost">✕ Close</button>
    </div>
    <div id="v2-picker-list" class="v2-picker-list"></div>
  </div>
</div>

<div id="v2-toast"></div>

<script>
(function () {
  const u = JSON.parse(localStorage.getItem('pnec_user') || 'null');
  if (!u || u.role !== 'admin') {
    document.getElementById('v2-gate').classList.add('visible');
    return;
  }
  document.getElementById('v2-shell').classList.add('visible');
})();
</script>

<script src="{{ '/assets/js/admin/editor-v2-api.js' | relative_url }}"></script>
<script src="{{ '/assets/js/admin/editor-v2-controller.js' | relative_url }}"></script>
