<!--
  Admin Security Dashboard (v3.7)

  Real-time picture of who is trying to do what to the site:
    • Headline tiles: 24h failed logins, 24h alerts, currently-locked
      accounts, recent admin actions
    • Currently-locked accounts list with per-row "Unlock" action
    • Live event timeline (filterable by kind + severity)
    • Top event kinds in last 7 days

  Backend: /api/security/summary, /events, /lockouts, /unlock,
  /events/prune. All routes are admin-gated by @requires_role('admin').
-->

<div id="as-root" class="as-wrap">
  <div class="as-empty"><p>Loading security dashboard…</p></div>
</div>

<script type="module">
const root = document.getElementById('as-root');

function isAdmin() {
  try {
    const raw = localStorage.getItem('pnec_user') || sessionStorage.getItem('pnec_user');
    if (!raw) return false;
    const u = JSON.parse(raw);
    return u && u.role === 'admin';
  } catch (_e) { return false; }
}

if (!isAdmin()) {
  root.innerHTML = `
    <div class="as-not-admin">
      <h2>Admins only</h2>
      <p>Sign in with an admin account to see the security dashboard.</p>
    </div>`;
} else {
  init();
}

function apiBase() {
  const h = location.hostname;
  return (h === 'localhost' || h === '127.0.0.1')
    ? 'http://127.0.0.1:8425'
    : 'https://beasts.opencodingsociety.com';
}
function authHeaders() {
  const t = localStorage.getItem('pnec_token') || '';
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, ch =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function relTime(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime();
  const diff = Date.now() - t;
  if (diff < 60_000) return 'just now';
  if (diff < 3_600_000) return Math.floor(diff / 60_000) + 'm ago';
  if (diff < 86_400_000) return Math.floor(diff / 3_600_000) + 'h ago';
  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
const KIND_LABEL = {
  login_success:  'Sign-in success',
  login_failure:  'Failed sign-in',
  login_locked:   'Account locked',
  login_rate_limit: 'IP rate-limited',
  register:       'Account created',
  register_duplicate: 'Duplicate registration',
  password_reset: 'Password reset',
  profile_update: 'Profile updated',
  role_change:    'Role changed',
  admin_action:   'Admin action',
  admin_unlock:   'Admin manual unlock',
  publish_page:   'Page published',
  revert_revision:'Page reverted',
  theme_publish:  'Theme published',
  push_subscribe: 'Push subscription',
  suspicious:     'Suspicious activity',
  api_error:      'API error',
  events_pruned:  'Events pruned',
};

function init() {
  render();
}

async function render() {
  let summary = null, events = [], lockouts = null;
  try {
    const [s, e, l] = await Promise.all([
      fetch(apiBase() + '/api/security/summary', { credentials: 'include', headers: authHeaders() }),
      fetch(apiBase() + '/api/security/events?limit=200', { credentials: 'include', headers: authHeaders() }),
      fetch(apiBase() + '/api/security/lockouts', { credentials: 'include', headers: authHeaders() }),
    ]);
    if (s.ok) summary = await s.json();
    if (e.ok) events = (await e.json()).events || [];
    if (l.ok) lockouts = (await l.json()).lockouts || [];
  } catch (_err) {
    root.innerHTML = `<div class="as-not-admin"><h2>Couldn't load dashboard</h2><p>The security API is unreachable. Check that the Flask backend is running.</p></div>`;
    return;
  }
  if (!summary) {
    root.innerHTML = `<div class="as-not-admin"><h2>Backend unavailable</h2><p>The /api/security endpoints didn't respond. The backend may not have the security blueprint registered yet.</p></div>`;
    return;
  }

  const s24 = summary.last_24h || {};
  const s7  = summary.last_7d || {};
  const topKinds = s7.top_kinds || [];
  const maxKind = topKinds.length ? topKinds[0][1] : 1;

  root.innerHTML = `
    <header class="as-head">
      <div>
        <h1>Security dashboard</h1>
        <p class="as-sub">Real-time view of failed logins, lockouts, audit events, and admin activity.</p>
      </div>
      <div class="as-actions">
        <span class="as-status"><span class="as-status-dot"></span><span id="as-last-updated">Updated just now</span></span>
        <button class="as-btn" id="as-refresh-btn">↻ Refresh</button>
        <a class="as-btn" href="${'{{ "/pages/admin.html" | relative_url }}'}">← Admin home</a>
      </div>
    </header>

    <div class="as-grid">
      <div class="as-tile ${(s24.alerts || 0) > 0 ? 'as-tile-alert' : 'as-tile-ok'}">
        <div class="as-tile-label">⚠ Alerts (24h)</div>
        <div class="as-tile-value">${s24.alerts || 0}</div>
        <div class="as-tile-foot">${(s24.alerts || 0) === 0 ? 'No high-severity events' : 'Investigate alert + critical events'}</div>
      </div>
      <div class="as-tile ${(s24.login_failures || 0) > 20 ? 'as-tile-warn' : ''}">
        <div class="as-tile-label">Failed sign-ins (24h)</div>
        <div class="as-tile-value">${s24.login_failures || 0}</div>
        <div class="as-tile-foot">${s24.login_successes || 0} successful · ${s24.registrations || 0} new accounts</div>
      </div>
      <div class="as-tile ${(summary.currently_locked || []).length > 0 ? 'as-tile-warn' : 'as-tile-ok'}">
        <div class="as-tile-label">Locked accounts</div>
        <div class="as-tile-value">${(summary.currently_locked || []).length}</div>
        <div class="as-tile-foot">${(summary.currently_locked || []).length === 0 ? 'None right now' : 'Auto-unlock after 15 min'}</div>
      </div>
      <div class="as-tile">
        <div class="as-tile-label">Events (7d)</div>
        <div class="as-tile-value">${s7.total_events || 0}</div>
        <div class="as-tile-foot">All severities combined</div>
      </div>
    </div>

    <div class="as-row">
      <div class="as-card-block">
        <h2>Recent events <span class="as-card-sub">last 7 days · newest first</span></h2>
        <div class="as-filters">
          <select id="as-filter-severity">
            <option value="">All severities</option>
            <option value="critical">Critical</option>
            <option value="alert">Alert</option>
            <option value="warning">Warning</option>
            <option value="info">Info</option>
          </select>
          <select id="as-filter-kind">
            <option value="">All kinds</option>
            ${Object.entries(KIND_LABEL).map(([k, lbl]) =>
              `<option value="${k}">${escapeHtml(lbl)}</option>`).join('')}
          </select>
          <input type="search" id="as-filter-q" placeholder="Search detail / email / IP" autocomplete="off">
        </div>
        <ul class="as-events" id="as-events-list">
          ${renderEventList(events)}
        </ul>
      </div>

      <div>
        <div class="as-card-block" style="margin-bottom:14px;">
          <h2>Currently locked <span class="as-card-sub">${(lockouts || []).length}</span></h2>
          ${(lockouts && lockouts.length) ? `
            <div class="as-lockouts">
              ${lockouts.map(l => `
                <div class="as-lockout">
                  <span class="as-lockout-email">${escapeHtml(l.email)}</span>
                  <span class="as-lockout-time">${Math.ceil(l.unlock_in_sec / 60)} min</span>
                  <button class="as-btn as-btn-primary" data-unlock="${escapeHtml(l.email)}" style="font-size:0.78rem; padding:6px 11px;">Unlock</button>
                </div>
              `).join('')}
            </div>` : `
            <div class="as-empty as-empty-ok">
              <div class="as-empty-icon">✓</div>
              <div>No accounts locked.</div>
            </div>`}
        </div>

        <div class="as-card-block">
          <h2>Top events <span class="as-card-sub">last 7 days</span></h2>
          ${topKinds.length ? topKinds.map(([k, n]) => `
            <div class="as-bar-row">
              <span class="as-bar-label">${escapeHtml(KIND_LABEL[k] || k)}</span>
              <span class="as-bar-track"><span class="as-bar-fill" style="width:${Math.round(100 * n / maxKind)}%"></span></span>
              <span class="as-bar-count">${n}</span>
            </div>`).join('') : `<div class="as-empty">No events yet.</div>`}
        </div>
      </div>
    </div>
  `;

  // Wire interactivity
  document.getElementById('as-refresh-btn').addEventListener('click', render);
  document.querySelectorAll('[data-unlock]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const email = btn.dataset.unlock;
      if (!confirm(`Unlock ${email}?\n\nThis clears the lockout immediately and resets the failed-attempt counter.`)) return;
      btn.disabled = true; btn.textContent = '…';
      try {
        const r = await fetch(apiBase() + '/api/security/unlock', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify({ email })
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        render();
      } catch (e) {
        alert('Unlock failed: ' + (e.message || ''));
        btn.disabled = false; btn.textContent = 'Unlock';
      }
    });
  });
  // Filters
  const filterSev = document.getElementById('as-filter-severity');
  const filterKind = document.getElementById('as-filter-kind');
  const filterQ = document.getElementById('as-filter-q');
  function applyFilters() {
    const sev = filterSev.value;
    const kind = filterKind.value;
    const q = (filterQ.value || '').trim().toLowerCase();
    const filtered = events.filter(ev => {
      if (sev && ev.severity !== sev) return false;
      if (kind && ev.kind !== kind) return false;
      if (q) {
        const blob = (ev.detail || '') + ' ' + (ev.actor_email || '') + ' ' + (ev.ip || '');
        if (!blob.toLowerCase().includes(q)) return false;
      }
      return true;
    });
    document.getElementById('as-events-list').innerHTML = renderEventList(filtered);
  }
  filterSev.addEventListener('change', applyFilters);
  filterKind.addEventListener('change', applyFilters);
  filterQ.addEventListener('input', applyFilters);
}

function renderEventList(events) {
  if (!events.length) {
    return `<li class="as-empty"><div class="as-empty-icon">✓</div><div>No events match the current filters.</div></li>`;
  }
  return events.map(ev => `
    <li class="as-event as-sev-${escapeHtml(ev.severity || 'info')}">
      <span class="as-event-dot" aria-hidden="true"></span>
      <div class="as-event-body">
        <div class="as-event-title">
          <span class="as-kind-pill">${escapeHtml(ev.kind)}</span>
          ${escapeHtml(KIND_LABEL[ev.kind] || ev.kind)}
        </div>
        ${ev.detail ? `<div class="as-event-detail">${escapeHtml(ev.detail)}</div>` : ''}
        <div class="as-event-meta">
          ${ev.actor_email ? `<span>👤 <code>${escapeHtml(ev.actor_email)}</code></span>` : ''}
          ${ev.ip ? `<span>📍 <code>${escapeHtml(ev.ip)}</code></span>` : ''}
        </div>
      </div>
      <span class="as-event-time">${escapeHtml(relTime(ev.created_at))}</span>
    </li>`).join('');
}
</script>
