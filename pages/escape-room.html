<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Poway Prepared — Emergency Escape Room | PNEC</title>
  <link rel="stylesheet" href="{{ '/assets/css/chatbot.css' | relative_url }}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #game-canvas { position: absolute; image-rendering: pixelated; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- Inline utilities (normally from pnec-base.html, not available with layout: null) -->
  <script>
    var API_BASE = 'http://localhost:8587';
    function validateResponse(r) { if (!r.ok) throw new Error(r.status); return r; }
    function escapeHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>

  <!-- 1. Engine: canvas (defines LOGICAL_WIDTH, LOGICAL_HEIGHT, CANVAS_SCALE) -->
  <script src="{{ '/assets/js/engine/canvas.js' | relative_url }}"></script>

  <!-- 2. Engine: input (needs LOGICAL_WIDTH, CANVAS_SCALE) -->
  <script src="{{ '/assets/js/engine/input.js' | relative_url }}"></script>

  <!-- 3. Game data: world (defines TILE_SIZE, MAP_COLS, MAP_ROWS, TILES, WORLD_MAP) -->
  <script src="{{ '/assets/js/game-data/world.js' | relative_url }}"></script>

  <!-- 4. Game data: items (needs TILE_SIZE) -->
  <script src="{{ '/assets/js/game-data/items.js' | relative_url }}"></script>

  <!-- 5. Game data: NPCs (needs TILE_SIZE) -->
  <script src="{{ '/assets/js/game-data/npcs.js' | relative_url }}"></script>

  <!-- 6. Game data: disasters (needs TILE_SIZE, MAP_COLS, MAP_ROWS, TILES, LOGICAL_WIDTH, LOGICAL_HEIGHT) -->
  <script src="{{ '/assets/js/game-data/disasters.js' | relative_url }}"></script>

  <!-- 7. Engine: collision (needs TILE_SIZE, isTileWalkable) -->
  <script src="{{ '/assets/js/engine/collision.js' | relative_url }}"></script>

  <!-- 8. Engine: dialogue (needs LOGICAL_WIDTH, LOGICAL_HEIGHT) -->
  <script src="{{ '/assets/js/engine/dialogue.js' | relative_url }}"></script>

  <!-- 9. Engine: inventory (needs MAX_SLOTS) -->
  <script src="{{ '/assets/js/engine/inventory.js' | relative_url }}"></script>

  <!-- 10. Engine: renderer (needs all tile/world/sprite globals) -->
  <script src="{{ '/assets/js/engine/renderer.js' | relative_url }}"></script>

  <!-- 11. UI: HUD (needs LOGICAL_WIDTH, LOGICAL_HEIGHT, DISASTER_DEFS, getInventorySlots) -->
  <script src="{{ '/assets/js/ui/escape-room-ui.js' | relative_url }}"></script>

  <!-- 12. API worker -->
  <script src="{{ '/assets/js/api/escape-room-api.js' | relative_url }}"></script>

  <!-- 13. Orchestrator — must load last -->
  <script src="{{ '/assets/js/pages/escape-room.js' | relative_url }}"></script>

  {% include chatbot/chatbot-widget.html %}
  <script src="{{ '/assets/js/utils/errors.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/api/auth-api.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/api/faq-api.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/ui/chatbot-ui.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/pages/chatbot.js' | relative_url }}"></script>
</body>
</html>
