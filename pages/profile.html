---
layout: pnec-base
title: "My Profile"
description: "Manage your PNEC account."
body_class: inner-page
---

<style>
.profile-page { max-width: 740px; margin: 0 auto; padding: 48px 24px 80px; }

/* ── Avatar ─────────────────────────────────────────────────────────────── */
.profile-avatar-wrap {
  position: relative;
  width: 100px;
  height: 100px;
  flex-shrink: 0;
}
.profile-avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0a1628 0%, #c0392b 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.2rem;
  font-weight: 800;
  color: #fff;
  text-transform: uppercase;
  overflow: hidden;
}
.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
.avatar-change-btn {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #0a1628;
  border: 2px solid #fff;
  color: #fff;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s;
}
.avatar-change-btn:hover { background: #c0392b; }

/* ── Profile header card ─────────────────────────────────────────────────── */
.profile-card {
  background: #fff;
  border: 1px solid #e8e6e1;
  border-radius: 20px;
  padding: 32px;
  display: flex;
  gap: 24px;
  align-items: flex-start;
  margin-bottom: 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.profile-meta {}
.profile-name {
  font-size: 1.45rem;
  font-weight: 800;
  color: #0a1628;
  margin: 0 0 4px;
}
.profile-email {
  color: #5a5a5a;
  font-size: 0.9rem;
  margin: 0 0 8px;
}
.profile-bio-display {
  color: #5a5a5a;
  font-size: 0.88rem;
  margin: 0 0 8px;
  font-style: italic;
}
.profile-joined {
  color: #9e9e9e;
  font-size: 0.8rem;
  margin: 0;
}

/* ── Edit form ────────────────────────────────────────────────────────────── */
.profile-edit-section {
  background: #fff;
  border: 1px solid #e8e6e1;
  border-radius: 20px;
  padding: 28px 32px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.profile-edit-section h3 {
  font-size: 1rem;
  font-weight: 700;
  color: #0a1628;
  margin: 0 0 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid #f0ede8;
}
.form-field { margin-bottom: 18px; }
.form-field label {
  display: block;
  font-size: 0.82rem;
  font-weight: 600;
  color: #0a1628;
  margin-bottom: 6px;
}
.form-field input,
.form-field textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #d8d5d0;
  border-radius: 10px;
  font-size: 0.92rem;
  color: #0a1628;
  background: #fafaf8;
  box-sizing: border-box;
  transition: border-color 0.2s;
  font-family: inherit;
}
.form-field input:focus,
.form-field textarea:focus {
  outline: none;
  border-color: #0a1628;
  background: #fff;
}
.form-field textarea {
  resize: vertical;
  min-height: 80px;
}
.form-field small {
  display: block;
  margin-top: 5px;
  color: #9e9e9e;
  font-size: 0.77rem;
}
.profile-save-btn {
  background: #0a1628;
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 11px 24px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.profile-save-btn:hover { background: #c0392b; }
.profile-save-btn:disabled { background: #9e9e9e; cursor: not-allowed; }
.profile-success { color: #27ae60; font-size: 0.85rem; margin-top: 12px; display: none; }
.profile-error   { color: #c0392b; font-size: 0.85rem; margin-top: 12px; display: none; }

/* ── Avatar URL modal ────────────────────────────────────────────────────── */
.avatar-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 500;
  align-items: center;
  justify-content: center;
}
.avatar-modal-overlay.open { display: flex; }
.avatar-modal {
  background: #fff;
  border-radius: 20px;
  padding: 28px;
  max-width: 420px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.avatar-modal h4 { font-size: 1rem; font-weight: 700; margin: 0 0 16px; }
.avatar-modal input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #d8d5d0;
  border-radius: 10px;
  font-size: 0.9rem;
  box-sizing: border-box;
  margin-bottom: 12px;
}
.avatar-modal-btns { display: flex; gap: 10px; }
.btn-modal-save, .btn-modal-cancel {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
}
.btn-modal-save { background: #0a1628; color: #fff; }
.btn-modal-cancel { background: #f0ede8; color: #0a1628; }

.spinner-sm {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<!-- Avatar upload modal -->
<div class="avatar-modal-overlay" id="avatar-modal-overlay">
  <div class="avatar-modal">
    <h4>Change Profile Picture</h4>

    <!-- File upload zone -->
    <label id="avatar-drop-zone" for="avatar-file-input" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed #d8d5d0;border-radius:12px;padding:28px 16px;cursor:pointer;background:#fafaf8;margin-bottom:12px;transition:border-color 0.2s;">
      <div id="avatar-preview-wrap" style="display:none;width:80px;height:80px;border-radius:50%;overflow:hidden;border:2px solid #e8e6e1;">
        <img id="avatar-preview-img" src="" alt="Preview" style="width:100%;height:100%;object-fit:cover;">
      </div>
      <span id="avatar-drop-label" style="font-size:0.88rem;color:#5a5a5a;text-align:center;">
        📁 Click to choose a photo<br><span style="font-size:0.78rem;color:#9e9e9e;">JPG, PNG, GIF, WebP · max 5 MB</span>
      </span>
      <input type="file" id="avatar-file-input" accept="image/*" style="display:none;">
    </label>

    <div id="avatar-error" style="display:none;font-size:0.82rem;color:#c0392b;margin-bottom:8px;"></div>

    <div class="avatar-modal-btns">
      <button class="btn-modal-cancel" id="avatar-modal-cancel">Cancel</button>
      <button class="btn-modal-save" id="avatar-modal-save" disabled style="opacity:0.5;">Apply</button>
    </div>
  </div>
</div>

<div class="profile-page">
  <div id="profile-content">
    <div style="display:flex;align-items:center;justify-content:center;height:180px;">
      <span class="spinner"></span>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
(function() {
  var siteBase = window.PNEC_SITE_BASE || (window.location.pathname.startsWith('/Beasts_FrontEnd') ? '/Beasts_FrontEnd' : '');
  var container = document.getElementById('profile-content');
  var pendingAvatarUrl = null;

  // Show cached user immediately
  var cachedUser = null;
  try {
    var raw = localStorage.getItem('pnec_user') || sessionStorage.getItem('pnec_user');
    cachedUser = raw ? JSON.parse(raw) : null;
  } catch (_) {}
  if (cachedUser) renderProfile(cachedUser);

  var sessionValid = false;

  // Verify and refresh from server
  fetchCurrentUser()
    .then(function(user) {
      if (user) {
        sessionValid = true;
        localStorage.setItem('pnec_user', JSON.stringify(user));
        renderProfile(user);
      } else {
        // Server says not logged in
        if (!cachedUser) {
          window.location.href = siteBase + '/pages/register.html?next=' + encodeURIComponent(siteBase + '/pages/profile.html') + '#login';
        } else {
          // Show cached profile but disable saving — session is gone
          showSessionBanner();
        }
      }
    })
    .catch(function() {
      if (!cachedUser) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>Unable to load profile</h3><p>Please <a href="' + siteBase + '/pages/register.html#login">sign in</a>.</p></div>';
      }
      // If cached user exists, leave profile visible but show banner
      else { showSessionBanner(); }
    });

  function showSessionBanner() {
    var loginUrl = siteBase + '/pages/register.html?next=' + encodeURIComponent(siteBase + '/pages/profile.html') + '#login';
    var banner = document.createElement('div');
    banner.id = 'session-expired-banner';
    banner.style.cssText = 'background:#fff3cd;border:1px solid #ffc107;border-radius:12px;padding:14px 18px;margin-bottom:16px;font-size:0.88rem;color:#856404;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;';
    banner.innerHTML = '<span>⚠️ Your session expired — changes won\'t be saved until you log in again.</span><a href="' + loginUrl + '" style="background:#0a1628;color:#fff;padding:7px 14px;border-radius:8px;font-weight:700;font-size:0.82rem;text-decoration:none;white-space:nowrap;">Log in</a>';
    var profileContent = document.getElementById('profile-content');
    if (profileContent) profileContent.insertBefore(banner, profileContent.firstChild);
    // Disable save button
    var saveBtn = document.getElementById('profile-save-btn');
    if (saveBtn) { saveBtn.disabled = true; saveBtn.style.background = '#9e9e9e'; saveBtn.title = 'Log in to save changes'; }
  }

  function calcCompletion(user) {
    var score = 0;
    var missing = [];
    if (user.avatar_url) { score += 25; } else { missing.push({ label: 'Add a profile photo', pct: 25, action: 'avatar' }); }
    if (user.bio && user.bio.trim().length > 10) { score += 25; } else { missing.push({ label: 'Write a short bio', pct: 25, action: 'bio' }); }
    if (user.phone && user.phone.trim()) { score += 20; } else { missing.push({ label: 'Add your phone number', pct: 20, action: 'phone' }); }
    if (user.neighborhood_id) { score += 30; } else { missing.push({ label: 'Set your neighborhood', pct: 30, action: 'neighborhood' }); }
    return { score: score, missing: missing };
  }

  function buildBadges(user) {
    var today = new Date().toISOString().slice(0, 10);
    var streakData = null;
    try { streakData = JSON.parse(localStorage.getItem('pnec_checkin_' + user.id) || 'null'); } catch(e) {}
    var streakCount = 0;
    if (streakData) {
      var yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      if (streakData.last === today || streakData.last === yesterday) streakCount = streakData.count || 0;
    }
    var kitData = null;
    try { kitData = JSON.parse(localStorage.getItem('pnec_kit_' + user.id) || 'null'); } catch(e) {}
    var kitCount = kitData ? Object.keys(kitData).filter(function(k) { return kitData[k]; }).length : 0;

    var comp = calcCompletion(user);
    var badges = [
      { icon: '🏠', label: 'Neighbor', desc: 'Created your account', earned: true },
      { icon: '📸', label: 'Photo Ready', desc: 'Uploaded a profile photo', earned: !!user.avatar_url },
      { icon: '✍️', label: 'Storyteller', desc: 'Wrote a bio', earned: !!(user.bio && user.bio.trim().length > 10) },
      { icon: '📞', label: 'Connected', desc: 'Added your phone number', earned: !!(user.phone && user.phone.trim()) },
      { icon: '📍', label: 'Local', desc: 'Set your neighborhood', earned: !!user.neighborhood_id },
      { icon: '⭐', label: 'All In', desc: 'Completed your full profile (100%)', earned: comp.score === 100 },
      { icon: '🔥', label: 'Daily Prep', desc: 'Checked in 3 days in a row', earned: streakCount >= 3 },
      { icon: '💎', label: 'Week Warrior', desc: '7-day check-in streak', earned: streakCount >= 7 },
      { icon: '🎒', label: 'Kit Starter', desc: 'Checked 5+ emergency kit items', earned: kitCount >= 5 },
      { icon: '✅', label: 'Kit Builder', desc: 'Checked 15+ emergency kit items', earned: kitCount >= 15 },
      { icon: '🛡️', label: 'Fully Prepared', desc: 'Completed your full emergency kit', earned: kitCount >= 20 },
    ];
    return badges;
  }

  window.pnecRefreshBadges = function() {
    var stored = localStorage.getItem('pnec_user') || sessionStorage.getItem('pnec_user');
    if (!stored) return;
    try {
      var user = JSON.parse(stored);
      var badgesEl = document.getElementById('profile-badges-grid');
      if (!badgesEl) return;
      badgesEl.innerHTML = buildBadges(user).map(function(b) {
        return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:14px;border:1px solid ' + (b.earned ? '#d4edda' : '#f0ede8') + ';background:' + (b.earned ? '#f0fff4' : '#fafaf8') + ';min-width:80px;text-align:center;" title="' + escapeHtml(b.desc) + '">' +
          '<span style="font-size:1.6rem;' + (b.earned ? '' : 'filter:grayscale(1);opacity:0.35;') + '">' + b.icon + '</span>' +
          '<span style="font-size:0.72rem;font-weight:700;color:' + (b.earned ? '#1a7a44' : '#9e9e9e') + ';line-height:1.2;">' + escapeHtml(b.label) + '</span>' +
        '</div>';
      }).join('');
    } catch(e) {}
  };

  function renderProfile(user) {
    var roleLabels = { coordinator: 'Coordinator', staff: 'Staff', admin: 'Admin' };
    var roleClasses = { coordinator: 'badge-coordinator', staff: 'badge-staff', admin: 'badge-admin' };
    var roleBadge = (user.role && user.role !== 'resident')
      ? '<span class="badge ' + (roleClasses[user.role] || '') + '">' + (roleLabels[user.role] || user.role) + '</span>'
      : '';

    var joined = user.created_at ? new Date(user.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long' }) : '';
    var joinedDays = user.created_at ? Math.floor((Date.now() - new Date(user.created_at).getTime()) / 86400000) : null;

    var avatarHtml = user.avatar_url
      ? '<img src="' + escapeHtml(user.avatar_url) + '" alt="Profile photo" onerror="this.style.display=\'none\';this.parentNode.dataset.initials=\'true\';">'
      : escapeHtml(getInitials(user.display_name));

    var oldBanner = document.getElementById('session-expired-banner');
    if (oldBanner) oldBanner.remove();

    // Completion meter
    var comp = calcCompletion(user);
    var barColor = comp.score < 40 ? '#e74c3c' : comp.score < 70 ? '#f39c12' : comp.score < 100 ? '#27ae60' : '#1a7a44';
    var missingHtml = comp.missing.length
      ? '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">' +
          comp.missing.map(function(m) {
            var anchor = m.action === 'avatar' ? '#avatar-change-btn' : m.action === 'bio' ? '#edit-bio' : m.action === 'phone' ? '#edit-phone' : '#edit-display-name';
            return '<a href="' + anchor + '" onclick="document.querySelector(\'' + anchor + '\')&&document.querySelector(\'' + anchor + '\').focus?document.querySelector(\'' + anchor + '\').focus():null" style="font-size:0.76rem;color:#0a1628;background:#f0ede8;padding:3px 10px;border-radius:99px;text-decoration:none;border:1px solid #d8d5d0;">+ ' + escapeHtml(m.label) + ' <span style=\'color:#9e9e9e\'>(' + m.pct + '%)</span></a>';
          }).join('') +
        '</div>'
      : '<div style="margin-top:8px;font-size:0.82rem;color:#1a7a44;font-weight:700;">🎉 Profile fully complete!</div>';

    var completionSection =
      '<div style="background:#fff;border:1px solid #e8e6e1;border-radius:16px;padding:20px 24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.05);">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
          '<span style="font-size:0.82rem;font-weight:700;color:#0a1628;text-transform:uppercase;letter-spacing:0.06em;">Profile Strength</span>' +
          '<span style="font-size:1.1rem;font-weight:800;color:' + barColor + ';">' + comp.score + '%</span>' +
        '</div>' +
        '<div style="background:#f0ede8;border-radius:99px;height:10px;overflow:hidden;">' +
          '<div style="background:' + barColor + ';width:' + comp.score + '%;height:100%;border-radius:99px;transition:width 0.6s ease;"></div>' +
        '</div>' +
        missingHtml +
      '</div>';

    // Badges section
    var badges = buildBadges(user);
    var badgesSection =
      '<div style="background:#fff;border:1px solid #e8e6e1;border-radius:16px;padding:20px 24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.05);">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">' +
          '<span style="font-size:0.82rem;font-weight:700;color:#0a1628;text-transform:uppercase;letter-spacing:0.06em;">Preparedness Badges</span>' +
          '<span style="font-size:0.78rem;color:#9e9e9e;">' + badges.filter(function(b){ return b.earned; }).length + ' / ' + badges.length + ' earned</span>' +
        '</div>' +
        '<div id="profile-badges-grid" style="display:flex;flex-wrap:wrap;gap:10px;">' +
          badges.map(function(b) {
            return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:14px;border:1px solid ' + (b.earned ? '#d4edda' : '#f0ede8') + ';background:' + (b.earned ? '#f0fff4' : '#fafaf8') + ';min-width:80px;text-align:center;" title="' + escapeHtml(b.desc) + '">' +
              '<span style="font-size:1.6rem;' + (b.earned ? '' : 'filter:grayscale(1);opacity:0.35;') + '">' + b.icon + '</span>' +
              '<span style="font-size:0.72rem;font-weight:700;color:' + (b.earned ? '#1a7a44' : '#9e9e9e') + ';line-height:1.2;">' + escapeHtml(b.label) + '</span>' +
            '</div>';
          }).join('') +
        '</div>' +
        '<p style="margin:12px 0 0;font-size:0.78rem;color:#9e9e9e;">Hover a badge to see how to earn it. Keep checking in and building your kit!</p>' +
      '</div>';

    container.innerHTML =
      '<div class="profile-card">' +
        '<div class="profile-avatar-wrap">' +
          '<div class="profile-avatar" id="profile-avatar-display">' + avatarHtml + '</div>' +
          '<button class="avatar-change-btn" id="avatar-change-btn" title="Change photo" aria-label="Change profile picture">✎</button>' +
        '</div>' +
        '<div class="profile-meta" style="flex:1;">' +
          '<h1 class="profile-name">' + escapeHtml(user.display_name) + ' ' + roleBadge + '</h1>' +
          '<p class="profile-email">' + escapeHtml(user.email) + '</p>' +
          (user.bio ? '<p class="profile-bio-display">' + escapeHtml(user.bio) + '</p>' : '') +
          '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;">' +
            (joined ? '<span style="font-size:0.8rem;color:#9e9e9e;">🗓 Member since ' + joined + (joinedDays !== null ? ' (' + joinedDays + ' days)' : '') + '</span>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +

      completionSection +
      badgesSection +

      '<div class="profile-edit-section">' +
        '<h3>Edit Profile</h3>' +
        '<div class="form-field">' +
          '<label for="edit-display-name">Display Name</label>' +
          '<input type="text" id="edit-display-name" value="' + escapeHtml(user.display_name) + '" maxlength="100">' +
        '</div>' +
        '<div class="form-field">' +
          '<label for="edit-bio">Bio</label>' +
          '<textarea id="edit-bio" maxlength="500" placeholder="Tell your neighbors a bit about yourself...">' + escapeHtml(user.bio || '') + '</textarea>' +
          '<small>Max 500 characters</small>' +
        '</div>' +
        '<div class="form-field">' +
          '<label for="edit-phone">Phone <span style="font-weight:400;color:#9e9e9e">(optional)</span></label>' +
          '<input type="tel" id="edit-phone" value="' + escapeHtml(user.phone || '') + '" placeholder="+1 (555) 000-0000" maxlength="20">' +
        '</div>' +
        '<button class="profile-save-btn" id="profile-save-btn">Save Changes</button>' +
        '<div class="profile-success" id="profile-success">✓ Profile updated successfully.</div>' +
        '<div class="profile-error" id="profile-error"></div>' +
      '</div>' +

      '<div style="margin-top:8px;">' +
        '<a href="' + siteBase + '/" class="btn btn-outline">← Back to Home</a>' +
      '</div>';

    bindProfileActions(user);
  }

  function bindProfileActions(user) {
    // Save button
    var saveBtn = document.getElementById('profile-save-btn');
    var successEl = document.getElementById('profile-success');
    var errorEl = document.getElementById('profile-error');
    if (saveBtn) {
      saveBtn.addEventListener('click', function() {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner-sm"></span>Saving…';
        successEl.style.display = 'none';
        errorEl.style.display = 'none';

        var payload = {
          display_name: document.getElementById('edit-display-name').value.trim(),
          bio: document.getElementById('edit-bio').value.trim() || null,
          phone: document.getElementById('edit-phone').value.trim() || null,
        };
        if (pendingAvatarUrl !== null) {
          payload.avatar_url = pendingAvatarUrl || null;
        }

        var apiBase = (typeof API_BASE !== 'undefined' ? API_BASE : 'http://localhost:8425');
        var token = localStorage.getItem('pnec_token');
        var headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;
        fetch(apiBase + '/api/auth/profile', {
          method: 'PATCH',
          credentials: 'include',
          headers: headers,
          body: JSON.stringify(payload),
        })
          .then(function(r) {
            if (r.status === 401) {
              var b = document.getElementById('profile-save-btn');
              if (b) { b.disabled = false; b.textContent = 'Save Changes'; }
              var e = document.getElementById('profile-error');
              if (e) {
                e.innerHTML = 'Your session expired. <a href="' + siteBase + '/pages/register.html?next=' + encodeURIComponent(siteBase + '/pages/profile.html') + '#login" style="color:#c0392b;font-weight:700;">Log in again</a> to save.';
                e.style.display = 'block';
              }
              return null;
            }
            return r.json();
          })
          .then(function(data) {
            if (!data) return;
            if (data.user) {
              localStorage.setItem('pnec_user', JSON.stringify(data.user));
              pendingAvatarUrl = null;
              renderProfile(data.user);
              setTimeout(function() {
                var s = document.getElementById('profile-success');
                if (s) { s.style.display = 'block'; setTimeout(function() { s.style.display = 'none'; }, 3000); }
              }, 50);
            } else {
              var e = document.getElementById('profile-error');
              if (e) { e.textContent = data.detail || data.message || 'Failed to save.'; e.style.display = 'block'; }
              var b = document.getElementById('profile-save-btn');
              if (b) { b.disabled = false; b.textContent = 'Save Changes'; }
            }
          })
          .catch(function() {
            var e = document.getElementById('profile-error');
            if (e) { e.textContent = 'Network error — please try again.'; e.style.display = 'block'; }
            var b = document.getElementById('profile-save-btn');
            if (b) { b.disabled = false; b.textContent = 'Save Changes'; }
          });
      });
    }

    // Avatar change button
    var avatarBtn = document.getElementById('avatar-change-btn');
    if (avatarBtn) {
      avatarBtn.addEventListener('click', function() {
        resetAvatarModal();
        document.getElementById('avatar-modal-overlay').classList.add('open');
      });
    }
  }

  // ── Avatar modal logic ─────────────────────────────────────────────────────
  var pendingAvatarDataUrl = null;

  function resetAvatarModal() {
    pendingAvatarDataUrl = null;
    var saveBtn = document.getElementById('avatar-modal-save');
    if (saveBtn) { saveBtn.disabled = true; saveBtn.style.opacity = '0.5'; }
    var preview = document.getElementById('avatar-preview-wrap');
    if (preview) preview.style.display = 'none';
    var label = document.getElementById('avatar-drop-label');
    if (label) label.innerHTML = '📁 Click to choose a photo<br><span style="font-size:0.78rem;color:#9e9e9e;">JPG, PNG, GIF, WebP · max 5 MB</span>';
    var err = document.getElementById('avatar-error');
    if (err) { err.style.display = 'none'; err.textContent = ''; }
    var fileInput = document.getElementById('avatar-file-input');
    if (fileInput) fileInput.value = '';
  }

  function resizeImageToDataUrl(file, maxSize, callback) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement('canvas');
        var scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
        canvas.width  = Math.round(img.width  * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        callback(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('avatar-file-input').addEventListener('change', function() {
    var file = this.files && this.files[0];
    var err = document.getElementById('avatar-error');
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      err.textContent = 'File too large — please choose an image under 5 MB.';
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    resizeImageToDataUrl(file, 400, function(dataUrl) {
      pendingAvatarDataUrl = dataUrl;
      var previewImg = document.getElementById('avatar-preview-img');
      var previewWrap = document.getElementById('avatar-preview-wrap');
      var label = document.getElementById('avatar-drop-label');
      if (previewImg) previewImg.src = dataUrl;
      if (previewWrap) previewWrap.style.display = 'block';
      if (label) label.innerHTML = '<span style="font-size:0.82rem;color:#27ae60;font-weight:600;">✓ Photo ready to apply</span><br><span style="font-size:0.75rem;color:#9e9e9e;">Click to choose a different one</span>';
      var saveBtn = document.getElementById('avatar-modal-save');
      if (saveBtn) { saveBtn.disabled = false; saveBtn.style.opacity = '1'; }
    });
  });

  // Drag-and-drop support
  var dropZone = document.getElementById('avatar-drop-zone');
  dropZone.addEventListener('dragover', function(e) { e.preventDefault(); this.style.borderColor = '#0a1628'; });
  dropZone.addEventListener('dragleave', function() { this.style.borderColor = '#d8d5d0'; });
  dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    this.style.borderColor = '#d8d5d0';
    var file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      document.getElementById('avatar-file-input').files; // can't assign directly
      var dt = new DataTransfer();
      dt.items.add(file);
      document.getElementById('avatar-file-input').files = dt.files;
      document.getElementById('avatar-file-input').dispatchEvent(new Event('change'));
    }
  });

  document.getElementById('avatar-modal-cancel').addEventListener('click', function() {
    document.getElementById('avatar-modal-overlay').classList.remove('open');
    resetAvatarModal();
  });
  document.getElementById('avatar-modal-save').addEventListener('click', function() {
    if (!pendingAvatarDataUrl) return;
    pendingAvatarUrl = pendingAvatarDataUrl;
    var display = document.getElementById('profile-avatar-display');
    if (display) display.innerHTML = '<img src="' + pendingAvatarDataUrl + '" alt="Profile photo">';
    document.getElementById('avatar-modal-overlay').classList.remove('open');
    resetAvatarModal();
  });
  document.getElementById('avatar-modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) { this.classList.remove('open'); resetAvatarModal(); }
  });

  function getInitials(name) {
    if (!name) return '?';
    var words = name.trim().split(/\s+/);
    if (words.length === 1) return words[0][0].toUpperCase();
    return (words[0][0] + words[words.length - 1][0]).toUpperCase();
  }
})();
});
</script>
