<body class="wp-singular page-template-default page wp-theme-jupiterx no-js ctct-jupiterx elementor-default elementor-kit-771 jupiterx-header-overlapped jupiterx-header-overlapped-tablet jupiterx-header-overlapped-mobile {{ page.body_class }}" itemscope="itemscope" itemtype="http://schema.org/WebPage">
  {% include poway-auth-header.html %}
  <main id="jupiterx-main" class="jupiterx-main">
    <div class="jupiterx-main-content">
      <div class="container">
        <div class="row">
          <div id="jupiterx-primary" class="jupiterx-primary col-lg-12">
            <div class="jupiterx-content" role="main" itemprop="mainEntityOfPage">
              <article class="jupiterx-post page type-page status-publish hentry" itemscope="itemscope" itemtype="http://schema.org/CreativeWork">
                <header class="jupiterx-post-header"></header>
                <div class="jupiterx-post-body" itemprop="articleBody">
                  <div class="jupiterx-post-content clearfix" itemprop="text">
                    {{ content }}
                  </div>
                </div>
              </article>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  {% include poway-auth-footer.html %}
  <script src="https://powaynec.com/wp-includes/js/jquery/jquery.min.js?ver=3.7.1"></script>
  <script src="https://powaynec.com/wp-includes/js/jquery/jquery-migrate.min.js?ver=3.4.1"></script>

    WebFont.load({ google: { families: ['Roboto:100,200,300,400,500,600,700,800,900'] } });
    (function() { document.body.className = document.body.className.replace('no-js', 'js'); }());
  </script>
  <script src="https://powaynec.com/wp-content/themes/jupiterx/lib/assets/dist/js/utils.min.js?ver=4.9.2"></script>
  <script>
    var jupiterxOptions = {"smoothScroll":"0","videMedia":"0","quantityFieldSwitch":"undefined"};
    var elementorFrontendConfig = {"is_rtl":false,"breakpoints":{"xs":0,"sm":480,"md":768,"lg":1026,"xl":1440,"xxl":1600},"swiperClass":"swiper","kit":{"viewport_tablet":1025,"active_breakpoints":["viewport_mobile","viewport_tablet"]},"post":{"id":0,"title":"{{ page.title | escape }}" }};
