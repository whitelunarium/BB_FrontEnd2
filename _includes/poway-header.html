<style>
.pnec-unified-header {
  position: relative;
  width: 100%;
  height: 500px;
  overflow: hidden;
}
.pnec-header-track {
  display: flex;
  height: 100%;
  transition: transform 0.8s ease;
}
.pnec-header-track > div {
  min-width: 100%;
  height: 100%;
}
.pnec-header-track img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.pnec-header-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10, 22, 40, 0.50);
}
.pnec-header-ui {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 28px 36px 0;
}
.pnec-header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.pnec-header-logo img {
  height: 90px;
  width: auto;
}
.pnec-header-donate {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: #27ae60;
  color: #fff;
  font-weight: 700;
  font-size: 0.82rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  padding: 10px 22px;
  border-radius: 6px;
  transition: background 0.2s;
}
.pnec-header-donate:hover { background: #219150; }
.pnec-header-title {
  text-align: center;
  color: #fff;
  font-size: clamp(2.4rem, 6vw, 4.2rem);
  font-weight: 300;
  letter-spacing: 0.01em;
  line-height: 1.1;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pnec-header-nav {
  background: rgba(10, 22, 40, 0.45);
  padding: 0 36px;
  margin: 0 -36px;
}
.pnec-header-nav ul {
  display: flex;
  flex-wrap: wrap;
  list-style: none;
  margin: 0;
  padding: 0;
  justify-content: center;
  gap: 0;
}
.pnec-header-nav li a {
  display: block;
  color: #fff;
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 500;
  padding: 14px 14px;
  white-space: nowrap;
  transition: color 0.15s;
  border-bottom: 2px solid transparent;
}
.pnec-header-nav li a:hover,
.pnec-header-nav li a.active {
  color: #7ed956;
  border-bottom-color: #7ed956;
}
</style>

<a class="jupiterx-a11y jupiterx-a11y-skip-navigation-link" href="#jupiterx-main">Skip to content</a>
<div class="jupiterx-site">

<div class="pnec-unified-header">
  <!-- Carousel background -->
  <div id="pnec-header-slides" class="pnec-header-track">
    <div><img src="{{ '/assets/images/Poway_Lake.jpg' | relative_url }}" alt=""></div>
    <div><img src="{{ '/assets/images/Poway_Fire.webp' | relative_url }}" alt=""></div>
    <div><img src="{{ '/assets/images/Poway_Flood.webp' | relative_url }}" alt=""></div>
    <div><img src="{{ '/assets/images/Poway_Lightning.webp' | relative_url }}" alt=""></div>
    <div><img src="{{ '/assets/images/Poway_Image.webp' | relative_url }}" alt=""></div>
  </div>

  <!-- Dark overlay -->
  <div class="pnec-header-overlay"></div>

  <!-- UI layer -->
  <div class="pnec-header-ui">
    <!-- Top row: logo + donate -->
    <div class="pnec-header-top">
      <a href="{{ '/' | relative_url }}" class="pnec-header-logo">
        <img src="https://powaynec.com/wp-content/uploads/2020/05/Poway-NEC-Logo-White@600x-768x307.png" alt="Poway NEC">
      </a>
      <a href="{{ '/pages/donate.html' | relative_url }}" class="pnec-header-donate">
        Donate Now <i class="fas fa-heart"></i>
      </a>
    </div>

    <!-- Page title -->
    <div class="pnec-header-title">{{ page.title }}</div>

    <!-- Nav bar -->
    <nav class="pnec-header-nav" aria-label="Main navigation">
      <ul>
        <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/pages/programs.html' | relative_url }}"{% if page.url contains '/programs' %} class="active"{% endif %}>About</a></li>
        <li><a href="{{ '/pages/programs.html' | relative_url }}"{% if page.url contains '/programs' %} class="active"{% endif %}>Programs and Services</a></li>
        <li><a href="{{ '/pages/resources.html' | relative_url }}"{% if page.url contains '/resources' %} class="active"{% endif %}>Preparedness Resources</a></li>
        <li><a href="{{ '/pages/events.html' | relative_url }}"{% if page.url contains '/events' %} class="active"{% endif %}>Community Events</a></li>
        <li><a href="{{ '/pages/neighborhood-map.html' | relative_url }}"{% if page.url contains '/neighborhood-map' %} class="active"{% endif %}>Find Your Neighborhood</a></li>
        <li><a href="{{ '/pages/statistics.html' | relative_url }}"{% if page.url contains '/statistics' %} class="active"{% endif %}>Statistics and Information</a></li>
        <li><a href="{{ '/pages/connect.html' | relative_url }}"{% if page.url contains '/connect' %} class="active"{% endif %}>Contact</a></li>
        <li id="poway-auth-display-item" style="display:none;">
          <a href="{{ '/pages/profile.html' | relative_url }}" id="poway-auth-display-link" aria-label="My Profile">
            <span id="poway-auth-display-name"></span><span id="poway-auth-display-location" style="display:none;"></span>
          </a>
        </li>
        <li id="poway-auth-login-item"><a href="{{ '/pages/login.html' | relative_url }}"{% if page.url contains '/login' %} class="active"{% endif %}>Login</a></li>
        <li id="poway-auth-register-item"><a href="{{ '/pages/register.html' | relative_url }}"{% if page.url contains '/register' %} class="active"{% endif %}>Register</a></li>
      </ul>
    </nav>
  </div>
</div>

<!-- Hidden mobile auth elements (required by auth-ui.js) -->
<span id="poway-auth-display-item-mobile" style="display:none;">
  <a href="{{ '/pages/profile.html' | relative_url }}" id="poway-auth-display-link-mobile">
    <span id="poway-auth-display-name-mobile"></span>
    <span id="poway-auth-display-location-mobile" style="display:none;"></span>
  </a>
</span>
<span id="poway-auth-login-item-mobile" style="display:none;"></span>
<span id="poway-auth-register-item-mobile" style="display:none;"></span>

<script>
(function() {
  var idx = 0, total = 5;
  var track = document.getElementById('pnec-header-slides');
  setInterval(function() {
    idx = (idx + 1) % total;
    track.style.transform = 'translateX(-' + (idx * 100) + '%)';
  }, 4000);
})();
</script>
